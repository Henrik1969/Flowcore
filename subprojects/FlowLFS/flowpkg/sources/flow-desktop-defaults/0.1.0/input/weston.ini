[core]
shell=desktop-shell.so
idle-time=0

[shell]
background-image=/usr/share/weston/background.png
background-type=scale-crop
panel-position=top
locking=false
animation=fade
startup-animation=fade

[launcher]
icon=/usr/share/weston/home.png
path=/usr/bin/flow-desktop-launcher

[launcher]
icon=/usr/share/weston/icon_terminal.png
path=/usr/bin/flow-terminal

[launcher]
icon=/usr/share/weston/icon_editor.png
path=/usr/bin/flow-app-editor

[launcher]
icon=/usr/share/weston/icon_window.png
path=/usr/bin/flow-app-files

[launcher]
icon=/usr/share/weston/wayland.png
path=/usr/bin/flow-app-monitor
